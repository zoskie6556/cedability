@if (isVisible()) {
  <div class="chat-widget">
    @if (isOpen()) {
      <section class="chat-panel" role="dialog" aria-label="Chat with CEDA support" aria-modal="false">
        <header class="chat-panel-header">
          <h2>CEDA Support</h2>
          <button type="button" class="chat-close" aria-label="Close chat" (click)="toggle()">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
        </header>

        <div class="chat-panel-body">
          @if (loading()) {
            <app-idea-loader label="Connecting you to support" />
          } @else {
            @if (unavailableNotice()) {
              <p class="chat-notice" role="status">{{ unavailableNotice() }}</p>
            }
            @if (error()) {
              <p class="chat-error" role="alert">{{ error() }}</p>
            }

            <app-chat-conversation
              class="chat-conversation-host"
              [messages]="messages()"
              [currentUid]="uid()"
              [statusLabel]="statusLabel()"
              [disabled]="chat()?.status === 'closed'"
              placeholder="Type your message..."
              (send)="send($event)"
            />
          }
        </div>

        @if (chat() && chat()?.status !== 'closed' && !loading()) {
          <footer class="chat-panel-footer">
            <button type="button" class="chat-end-button" (click)="endChat()">End chat</button>
          </footer>
        }
      </section>
    }

    <button
      type="button"
      class="chat-toggle"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-label]="isOpen() ? 'Close chat' : 'Chat with CEDA support'"
      (click)="toggle()"
    >
      @if (isOpen()) {
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 12a8 8 0 1 1 3.2 6.4L4 20l1.3-3.5A7.96 7.96 0 0 1 4 12Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      }
      <span class="sr-only">{{ isOpen() ? 'Close chat' : 'Chat with CEDA support' }}</span>
    </button>
  </div>
}
