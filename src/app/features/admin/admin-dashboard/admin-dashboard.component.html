<div class="admin-shell" [class.is-collapsed]="!sidebarOpen()">
  <aside class="admin-sidebar" aria-label="Admin navigation">
    <div class="brand-block">
      <div class="brand-mark">C</div>
      @if (sidebarOpen()) {
        <div class="brand-copy">
          <div class="brand-name">CEDAbility</div>
          <div class="brand-subtitle">Admin</div>
        </div>
      }
    </div>

    <nav class="admin-nav">
      @for (item of navigation; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-item"
          [attr.title]="!sidebarOpen() ? item.label : null"
        >
          <span class="nav-icon" aria-hidden="true" [innerHTML]="safeIcon(item.icon)"></span>
          @if (sidebarOpen()) {
            <span class="nav-label">{{ item.label }}</span>
          }
        </a>
      }
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar" aria-label="Admin toolbar">
      <div class="page-title-wrap">
        <button
          class="icon-button menu-toggle"
          type="button"
          aria-label="Toggle navigation menu"
          [attr.aria-expanded]="sidebarOpen()"
          (click)="toggleSidebar()"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <h1>Dashboard</h1>
      </div>

      <div class="topbar-actions">
        <label class="search-field" aria-label="Search">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="search" placeholder="Search admin..." />
        </label>

        <button class="icon-button notification-btn" type="button" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          @if (notificationCount() > 0) {
            <span class="notification-badge">
              {{ notificationCount() > 99 ? '99+' : notificationCount() }}
            </span>
          }
        </button>

        <!-- <button class="user-pill" type="button" aria-label="Account menu">
          <span class="avatar">A</span>
          <span class="user-meta">
            <span class="user-name">Admin</span>
            <span class="user-role">Workspace</span>
          </span>
        </button> -->
      </div>
    </header>

    <main class="admin-content">
      <router-outlet />
    </main>
  </div>
</div>
