
    <section class="page-shell">
      <p class="eyebrow">People</p>
      <h2>Staff activity</h2>
      <p>Track evaluator throughput, support responsiveness, and adjudicator workload.</p>

      <div class="stats-grid">
        <article class="card" *ngFor="let item of staffActivity">
          <div class="card-header">
            <strong>{{ item.name }}</strong>
            <span class="rating">{{ item.rating }}</span>
          </div>
          <div class="meta">{{ item.tasks }} tasks</div>
          <div class="focus">Focus: {{ item.focus }}</div>
        </article>
      </div>
    </section>
